name: citizenship_test
description: "US Citizenship civics test study & mock exam app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Audio: hear the question (TTS) and speak the answer (STT)
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0

  # Persistence for progress, settings, and cached state data
  shared_preferences: ^2.3.2

  # Live refresh of state-dependent answers (Congress.gov / civic APIs)
  http: ^1.2.2

  # Date math for the study plan
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
