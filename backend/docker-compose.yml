# Local development stack: SQL Server plus the API.
#
#   docker compose up -d sqlserver     # database only, run the API from your IDE
#   docker compose up --build          # database and API together
#
# The API migrates and seeds itself on startup, so the first run comes up with
# all 228 official questions and the 51 states already loaded.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: civicsprep-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-Your_password123}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # Wait until SQL Server actually answers queries, not just opens the port.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/CivicsPrep.Api/Dockerfile
    container_name: civicsprep-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;Database=CivicsPrep;User Id=sa;
        Password=${SQL_PASSWORD:-Your_password123};TrustServerCertificate=True;MultipleActiveResultSets=true
      # Override with a real secret outside local development.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-local-development-signing-key-at-least-32-bytes}"
      # Optional: enables the live Congress.gov lookup.
      Congress__ApiKey: "${CONGRESS_API_KEY:-}"
    ports:
      - "5199:8080"

volumes:
  sqlserver-data:
